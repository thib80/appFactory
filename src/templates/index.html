<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" id="vp">
  <title>Minesweeper</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg:             #fdf0d0;
      --card:           #fffdf5;
      --surface:        #fef5dc;
      --cell:           #dfc87a;
      --cell-press:     #cfb455;
      --cell-revealed:  #f9edcc;
      --cell-flagged:   #e07a38;
      --accent:         #a86800;
      --accent-dim:     rgba(168,104,0,.13);
      --danger:         #c93a3a;
      --danger-dim:     rgba(201,58,58,.15);
      --text:           #2a1600;
      --muted:          #9a7c3a;
      --border:         rgba(168,104,0,.22);
      --shadow:         rgba(168,104,0,.16);
      --cell-size:      36px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.25rem 1rem 3rem;
      user-select: none;
      -webkit-user-select: none;
    }

    /* ── Title ─────────────────────────────────────────────────────── */

    .title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: .12em;
      color: var(--accent);
      margin-bottom: 1.1rem;
    }

    /* ── Card ──────────────────────────────────────────────────────── */

    .card {
      background: var(--card);
      border-radius: 24px;
      box-shadow: 0 8px 32px var(--shadow);
      padding: 1.1rem 1rem 1.25rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .85rem;
    }

    /* ── Tabs ──────────────────────────────────────────────────────── */

    .tabs {
      display: flex;
      gap: .35rem;
      width: 100%;
    }

    .tab {
      flex: 1;
      padding: .4rem .2rem;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      border-radius: 12px;
      cursor: pointer;
      font-size: .78rem;
      font-weight: 700;
      letter-spacing: .04em;
      transition: all .15s;
    }

    .tab.active {
      background: var(--accent-dim);
      border-color: var(--accent);
      color: var(--accent);
    }

    /* ── Custom panel ──────────────────────────────────────────────── */

    .custom-panel {
      width: 100%;
      overflow: hidden;
      max-height: 0;
      opacity: 0;
      transition: max-height .3s ease, opacity .25s ease;
    }

    .custom-panel.open { max-height: 130px; opacity: 1; }

    .custom-inner {
      display: flex;
      align-items: flex-end;
      gap: .6rem;
      padding-top: .1rem;
    }

    .size-field {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: .25rem;
    }

    .size-field label {
      font-size: .7rem;
      font-weight: 700;
      color: var(--muted);
      letter-spacing: .05em;
      padding-left: .1rem;
    }

    .size-field input {
      width: 100%;
      padding: .5rem .4rem;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface);
      color: var(--text);
      font-size: .95rem;
      font-weight: 700;
      text-align: center;
      outline: none;
      transition: border-color .15s;
    }

    .size-field input:focus { border-color: var(--accent); }

    .custom-play {
      padding: .52rem .9rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: .85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      margin-bottom: 1px;
      transition: opacity .15s;
    }

    .custom-play:active { opacity: .8; }

    /* ── HUD ───────────────────────────────────────────────────────── */

    .hud {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: var(--surface);
      border-radius: 16px;
      padding: .55rem .75rem;
    }

    .lcd-wrap {
      display: flex;
      align-items: center;
      gap: .35rem;
      color: var(--muted);
      font-size: .8rem;
      font-weight: 700;
    }

    .lcd {
      background: #2a1600;
      border-radius: 8px;
      padding: .3rem .55rem;
      font-family: 'Courier New', monospace;
      font-size: 1.25rem;
      font-weight: 700;
      color: #ffc845;
      min-width: 3.4rem;
      text-align: center;
      letter-spacing: .08em;
    }

    .reset-btn {
      background: var(--card);
      border: 1.5px solid var(--border);
      border-radius: 50%;
      width: 48px;
      height: 48px;
      font-size: 1.5rem;
      cursor: pointer;
      box-shadow: 0 2px 8px var(--shadow);
      transition: transform .1s;
      line-height: 1;
    }

    .reset-btn:active { transform: scale(.88); }

    /* ── Mode toggle ───────────────────────────────────────────────── */

    .mode-toggle {
      display: flex;
      width: 100%;
      background: var(--surface);
      border-radius: 14px;
      padding: .3rem;
      gap: .3rem;
    }

    .mode-btn {
      flex: 1;
      padding: .55rem;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 10px;
      cursor: pointer;
      font-size: .9rem;
      font-weight: 700;
      transition: all .15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .35rem;
    }

    .mode-btn.active {
      background: var(--card);
      color: var(--accent);
      box-shadow: 0 2px 8px var(--shadow);
    }

    /* ── Grid ──────────────────────────────────────────────────────── */

    .grid-wrap {
      width: 100%;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
    }

    #grid {
      display: grid;
      gap: 3px;
      width: fit-content;
      margin: 0 auto;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--cell);
      border-radius: 7px;
      cursor: pointer;
      font-size: calc(var(--cell-size) * .5);
      font-weight: 800;
      box-shadow: 0 2px 0 rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.55);
      transition: background .08s, box-shadow .08s;
      touch-action: manipulation;
      -webkit-touch-callout: none;
    }

    .cell:not(.revealed):active {
      background: var(--cell-press);
      box-shadow: inset 0 1px 3px rgba(0,0,0,.12);
    }

    .cell.revealed {
      background: var(--cell-revealed);
      box-shadow: inset 0 1px 3px rgba(0,0,0,.07);
      cursor: default;
    }

    .cell.flagged {
      background: var(--cell-flagged);
      box-shadow: 0 2px 0 rgba(0,0,0,.1), inset 0 1px 0 rgba(255,255,255,.3);
    }

    .cell.mine      { background: var(--danger-dim); box-shadow: none; }
    .cell.mine-hit  { background: var(--danger);     box-shadow: none; }
    .cell.wrong-flag{ background: var(--danger-dim); box-shadow: none; }

    /* Classic number colours, adjusted for warm background */
    .cell.n1 { color: #1055b0; }
    .cell.n2 { color: #276f38; }
    .cell.n3 { color: #c02020; }
    .cell.n4 { color: #5c1a8a; }
    .cell.n5 { color: #b03000; }
    .cell.n6 { color: #10706a; }
    .cell.n7 { color: #7a0050; }
    .cell.n8 { color: #556070; }

    /* ── Hint ──────────────────────────────────────────────────────── */

    .hint {
      font-size: .7rem;
      color: var(--muted);
      text-align: center;
      margin-top: -.2rem;
    }

    /* ── Overlay ───────────────────────────────────────────────────── */

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(253,240,208,.72);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s;
    }

    .overlay.show { opacity: 1; pointer-events: all; }

    .overlay-card {
      background: var(--card);
      border-radius: 24px;
      padding: 2rem 2.5rem;
      box-shadow: 0 16px 48px var(--shadow);
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .6rem;
    }

    .ov-emoji { font-size: 3.5rem; line-height: 1; }
    .ov-title { font-size: 1.4rem; font-weight: 800; }
    .ov-sub   { font-size: .9rem; color: var(--muted); }

    .ov-btn {
      margin-top: .5rem;
      padding: .7rem 2rem;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity .15s;
    }

    .ov-btn:active { opacity: .85; }
  </style>
</head>
<body>

<h1 class="title">MINESWEEPER</h1>

<div class="card">

  <div class="tabs">
    <button class="tab active" data-idx="0">Easy</button>
    <button class="tab"        data-idx="1">Medium</button>
    <button class="tab"        data-idx="2">Hard</button>
    <button class="tab"        data-idx="3">Custom</button>
  </div>

  <div class="custom-panel" id="custom-panel">
    <div class="custom-inner">
      <div class="size-field">
        <label for="c-rows">ROWS</label>
        <input id="c-rows" type="number" min="5" max="24" value="10">
      </div>
      <div class="size-field">
        <label for="c-cols">COLS</label>
        <input id="c-cols" type="number" min="5" max="24" value="10">
      </div>
      <div class="size-field">
        <label for="c-mines">MINES</label>
        <input id="c-mines" type="number" min="1" max="200" value="15">
      </div>
      <button class="custom-play" id="custom-play">Play →</button>
    </div>
  </div>

  <div class="hud">
    <div class="lcd-wrap">
      <span>🚩</span>
      <div class="lcd" id="mines">010</div>
    </div>
    <button class="reset-btn" id="reset" aria-label="New game">🙂</button>
    <div class="lcd-wrap">
      <div class="lcd" id="timer">000</div>
      <span>⏱</span>
    </div>
  </div>

  <div class="mode-toggle">
    <button class="mode-btn active" id="dig-btn">⛏ Dig</button>
    <button class="mode-btn"        id="flag-btn">🚩 Flag</button>
  </div>

  <div class="grid-wrap">
    <div id="grid"></div>
  </div>

  <p class="hint">Long-press or switch to Flag mode to plant a flag &nbsp;·&nbsp; Tap a number when flagged to chord</p>

</div>

<div class="overlay" id="overlay">
  <div class="overlay-card">
    <div class="ov-emoji" id="ov-emoji"></div>
    <div class="ov-title" id="ov-title"></div>
    <div class="ov-sub"   id="ov-sub"></div>
    <button class="ov-btn" id="ov-btn">Play Again</button>
  </div>
</div>

<script>
  const LEVELS = [
    { rows: 9,  cols: 9,  mines: 10 },
    { rows: 12, cols: 12, mines: 25 },
    { rows: 16, cols: 16, mines: 50 },
    null, // custom — waits for Play button
  ];

  let rows, cols, mineCount;
  let board, revealed, flagged;
  let gameOver, firstClick;
  let timerVal, timerInterval;
  let mode = 'dig';
  let currentLevel = 0;

  // ── Viewport: scale so the grid always fills the screen at default zoom ─────

  function setViewport() {
    const gap = 3, bodyPad = 32, cardPad = 32;
    const cellNat = 38;
    const w = Math.max(cols * cellNat + (cols - 1) * gap + bodyPad + cardPad, 320);
    // initial-scale=1.0 forces the browser to reset any user zoom
    document.getElementById('vp').content =
      `width=${w}, initial-scale=1.0, minimum-scale=0.2, maximum-scale=8.0`;
  }

  // ── Init ────────────────────────────────────────────────────────────────────

  function initGame(r, c, m) {
    rows = r; cols = c; mineCount = m;

    board    = grid2d(rows, cols, 0);
    revealed = grid2d(rows, cols, false);
    flagged  = grid2d(rows, cols, false);

    gameOver = false; firstClick = true;
    timerVal = 0;
    clearInterval(timerInterval);

    document.getElementById('timer').textContent = '000';
    document.getElementById('mines').textContent = pad(mineCount);
    document.getElementById('reset').textContent = '🙂';
    document.getElementById('overlay').classList.remove('show');

    setMode('dig');
    setViewport();
    setCellSize();
    buildGrid();
  }

  function grid2d(r, c, v) {
    return Array.from({ length: r }, () => Array(c).fill(v));
  }

  // ── Mine placement ─────────────────────────────────────────────────────────

  function placeMines(sr, sc) {
    const cells = [];
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (Math.abs(r - sr) > 1 || Math.abs(c - sc) > 1) cells.push([r, c]);

    shuffle(cells);
    const actual = Math.min(mineCount, cells.length);
    for (let i = 0; i < actual; i++) board[cells[i][0]][cells[i][1]] = -1;

    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        if (board[r][c] === -1) continue;
        let n = 0;
        eachNeighbor(r, c, (nr, nc) => { if (board[nr][nc] === -1) n++; });
        board[r][c] = n;
      }
  }

  // ── Game logic ─────────────────────────────────────────────────────────────

  function reveal(r, c) {
    if (gameOver || revealed[r][c] || flagged[r][c]) return;

    if (firstClick) {
      placeMines(r, c);
      firstClick = false;
      startTimer();
    }

    if (board[r][c] === -1) {
      revealed[r][c] = true;
      endGame(false, r, c);
      return;
    }

    floodReveal(r, c);
    render();
    if (checkWin()) endGame(true);
  }

  function floodReveal(r, c) {
    if (r < 0 || r >= rows || c < 0 || c >= cols) return;
    if (revealed[r][c] || flagged[r][c] || board[r][c] === -1) return;
    revealed[r][c] = true;
    if (board[r][c] === 0)
      eachNeighbor(r, c, (nr, nc) => floodReveal(nr, nc));
  }

  function chordReveal(r, c) {
    if (!revealed[r][c] || board[r][c] <= 0) return;
    let f = 0;
    eachNeighbor(r, c, (nr, nc) => { if (flagged[nr][nc]) f++; });
    if (f !== board[r][c]) return;
    eachNeighbor(r, c, (nr, nc) => {
      if (!flagged[nr][nc] && !revealed[nr][nc]) reveal(nr, nc);
    });
  }

  function toggleFlag(r, c) {
    if (gameOver || revealed[r][c] || firstClick) return;
    flagged[r][c] = !flagged[r][c];
    updateCell(r, c);
    document.getElementById('mines').textContent = pad(mineCount - countFlags());
  }

  function checkWin() {
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++)
        if (board[r][c] !== -1 && !revealed[r][c]) return false;
    return true;
  }

  function endGame(won, hitR, hitC) {
    gameOver = true;
    clearInterval(timerInterval);
    document.getElementById('reset').textContent = won ? '😎' : '😵';

    if (!won) {
      setViewport(); // reset zoom so the full board reveal is visible
      for (let r = 0; r < rows; r++)
        for (let c = 0; c < cols; c++) {
          const el = getCell(r, c);
          if (board[r][c] === -1) {
            if (r === hitR && c === hitC) {
              el.className = 'cell mine-hit'; el.textContent = '💣';
            } else if (!flagged[r][c]) {
              el.className = 'cell mine revealed'; el.textContent = '💣';
            }
          } else if (flagged[r][c]) {
            el.className = 'cell wrong-flag revealed'; el.textContent = '❌';
          }
        }
    }

    document.getElementById('ov-emoji').textContent = won ? '🎉' : '💥';
    document.getElementById('ov-title').textContent = won ? 'You win!' : 'Boom!';
    document.getElementById('ov-sub').textContent   = won
      ? `Cleared in ${timerVal}s`
      : 'Better luck next time';
    setTimeout(() => document.getElementById('overlay').classList.add('show'), 350);
  }

  // ── Timer ──────────────────────────────────────────────────────────────────

  function startTimer() {
    timerInterval = setInterval(() => {
      timerVal = Math.min(timerVal + 1, 999);
      document.getElementById('timer').textContent = pad(timerVal);
    }, 1000);
  }

  // ── DOM ────────────────────────────────────────────────────────────────────

  function setCellSize() {
    const gap = 3, pad = 64;
    const avail = window.innerWidth - pad;
    const size = Math.min(
      Math.max(Math.floor((avail - (cols - 1) * gap) / cols), 20),
      56
    );
    document.documentElement.style.setProperty('--cell-size', size + 'px');
  }

  function buildGrid() {
    const grid = document.getElementById('grid');
    grid.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
    grid.innerHTML = '';
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) {
        const el = document.createElement('div');
        el.className = 'cell';
        attachListeners(el, r, c);
        grid.appendChild(el);
      }
  }

  function attachListeners(el, r, c) {
    let pressTimer = null;
    let longPressHandled = false;

    el.addEventListener('touchstart', () => {
      longPressHandled = false;
      pressTimer = setTimeout(() => {
        longPressHandled = true;
        pressTimer = null;
        toggleFlag(r, c);
      }, 480);
    }, { passive: true });

    el.addEventListener('touchend',  () => { clearTimeout(pressTimer); pressTimer = null; });
    el.addEventListener('touchmove', () => { clearTimeout(pressTimer); pressTimer = null; longPressHandled = true; });

    el.addEventListener('click', () => {
      if (longPressHandled) { longPressHandled = false; return; }
      if (mode === 'flag')        toggleFlag(r, c);
      else if (revealed[r][c])    chordReveal(r, c);
      else                        reveal(r, c);
    });

    // On Android, contextmenu fires after the long-press timeout already ran —
    // guard to avoid double-toggle.
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      if (!longPressHandled) toggleFlag(r, c);
      longPressHandled = false;
    });
  }

  function render() {
    document.getElementById('mines').textContent = pad(mineCount - countFlags());
    for (let r = 0; r < rows; r++)
      for (let c = 0; c < cols; c++) updateCell(r, c);
  }

  function updateCell(r, c) {
    const el = getCell(r, c);
    if (!el) return;
    el.className = 'cell';
    el.textContent = '';
    if (revealed[r][c]) {
      el.classList.add('revealed');
      if (board[r][c] === -1) { el.classList.add('mine'); el.textContent = '💣'; }
      else if (board[r][c] > 0) { el.classList.add('n' + board[r][c]); el.textContent = board[r][c]; }
    } else if (flagged[r][c]) {
      el.classList.add('flagged'); el.textContent = '🚩';
    }
  }

  function setMode(m) {
    mode = m;
    document.getElementById('dig-btn').classList.toggle('active', m === 'dig');
    document.getElementById('flag-btn').classList.toggle('active', m === 'flag');
  }

  function getCell(r, c) { return document.getElementById('grid').children[r * cols + c]; }

  // ── Helpers ────────────────────────────────────────────────────────────────

  function eachNeighbor(r, c, fn) {
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        if (!dr && !dc) continue;
        const nr = r + dr, nc = c + dc;
        if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) fn(nr, nc);
      }
  }

  function countFlags() {
    let n = 0;
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) if (flagged[r][c]) n++;
    return n;
  }

  function shuffle(a) {
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
  }

  function pad(n) { return String(Math.max(n, 0)).padStart(3, '0'); }

  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

  // ── Bindings ───────────────────────────────────────────────────────────────

  function replay() {
    // In custom mode there's no LEVELS entry — restart with current dimensions.
    if (currentLevel === 3) initGame(rows, cols, mineCount);
    else startLevel(currentLevel);
  }

  document.getElementById('reset').addEventListener('click', replay);
  document.getElementById('ov-btn').addEventListener('click', replay);
  document.getElementById('dig-btn').addEventListener('click', () => setMode('dig'));
  document.getElementById('flag-btn').addEventListener('click', () => setMode('flag'));

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      startLevel(parseInt(btn.dataset.idx, 10));
    });
  });

  document.getElementById('custom-play').addEventListener('click', () => {
    const r = clamp(parseInt(document.getElementById('c-rows').value,  10) || 10, 5, 24);
    const c = clamp(parseInt(document.getElementById('c-cols').value,  10) || 10, 5, 24);
    const m = clamp(parseInt(document.getElementById('c-mines').value, 10) || 15, 1, r * c - 9);
    initGame(r, c, m);
  });

  window.addEventListener('resize', () => {
    setCellSize();
    document.getElementById('grid').style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;
  });

  function startLevel(idx) {
    currentLevel = idx;
    const panel = document.getElementById('custom-panel');
    if (idx === 3) {
      panel.classList.add('open');
    } else {
      panel.classList.remove('open');
      const lv = LEVELS[idx];
      initGame(lv.rows, lv.cols, lv.mines);
    }
  }

  startLevel(0);
</script>
</body>
</html>
